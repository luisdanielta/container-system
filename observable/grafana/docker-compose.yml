services:
  loki:
    image: grafana/loki:3.4
    container_name: loki
    hostname: loki.docker.local
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - network_service # http://loki.docker.local:3100

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    networks:
      - network_service # 3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PSWD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - data:/var/lib/grafana
    depends_on:
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.docker.local`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  network_service:
    external: true

volumes:
  data:
    external: false
