[supervisord]
nodaemon=true               ; keep Supervisor in foreground
logfile=/dev/null           ; disable separate log file
logfile_maxbytes=0          ; don't rotate logs
loglevel=info               ; or 'warn' to reduce output
user=root                   ; run as root user

; ── one-shot: runs first, never restarts ──────────────────────────────────────
# [program:create-user]
# command=/usr/local/bin/create-user.sh
# priority=1                  ; run before SSH and Docker
# autostart=true
# autorestart=false           ; one-shot — never restart after exit
# startsecs=0                 ; don't require minimum uptime
# stdout_logfile=/var/log/create_user.log
# stdout_logfile_maxbytes=10MB
# stdout_logfile_backups=5
# stderr_logfile=/var/log/create_user_error.log
# stderr_logfile_maxbytes=10MB
# stderr_logfile_backups=5

; ── long-running services (start after create-user via priority) ──────────────
[program:ssh]
command=/usr/sbin/sshd -D
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:docker]
command=bash -c "command -v dockerd >/dev/null && exec dockerd || exit 0"
priority=10
autostart=true
autorestart=unexpected
exitcodes=0
stdout_logfile=/var/log/docker_daemon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/docker_daemon_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5