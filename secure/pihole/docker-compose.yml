services:
  dns:
    image: pihole/pihole:2026.02.0
    container_name: pihole
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PASSWORD}
      SKIPGRAVITYONBOOT: true
    
    volumes:
      - ./pihole.toml:/etc/pihole/pihole.toml
      - data:/etc/pihole/
      # - dnsmasq:/etc/dnsmasq.d/
    
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - SYS_TIME

    networks:
      network_security:
        ipv4_address: 10.10.5.200 # :53/tcp/udp :67/udp :443/tcp :80/tcp
      network_user:
        ipv4_address: 10.10.4.200
      network_service:
        ipv4_address: 10.10.3.200

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pi.docker.local`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.docker.network=network_service"

networks:
  network_security:
    external: true
  network_service:
    external: true
  network_user:
    external: true

volumes:
  data:
    external: false
  # dnsmasq:
    # external: false
