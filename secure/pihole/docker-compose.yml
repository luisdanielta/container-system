services:
  pihole:
    container_name: dns_pihole
    image: pihole/pihole:2025.07.1
    environment:
      TZ: 'America/Bogota'
      FTLCONF_dns_upstreams: "10.10.5.201#5053"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_webserver_api_password: ${PIHOLE_PSWD}
      SKIPGRAVITYONBOOT: true
    volumes:
      - data:/etc/pihole/
      - dnsmasq:/etc/dnsmasq.d/
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pi.docker.local`)"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      
    ports:
      - 53:53 
      - 53:53/udp
      - 67:67/udp
      - 443:443
      - 8090:80
    networks:
      network_security:
        ipv4_address: 10.10.5.200 # :53/tcp/udp :67/udp :443/tcp :80/tcp
      network_user:
        ipv4_address: 10.10.4.200
      network_service:
        ipv4_address: 10.10.3.200

networks:
  network_security:
    external: true
  network_service:
    external: true
  network_user:
    external: true

volumes:
  data:
    external: false
  dnsmasq:  
    external: false