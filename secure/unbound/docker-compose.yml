services:
  unbound:
    container_name: dns_unbound
    image: mvance/unbound:1.21.1
    restart: unless-stopped
    networks:
      network_security:
        ipv4_address: 10.10.5.201 # :53/tcp/udp
    volumes:
      - data:/opt/unbound/etc/unbound/
    healthcheck:
      test: [ "NONE" ]

networks:
  network_security:
    external: true

volumes:
  data:
    external: false
