services:
  n8n:
    image: n8nio/n8n:2.3.4-amd64
    container_name: n8n
    restart: unless-stopped

    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=10.10.3.153
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres_shared
      - DB_POSTGRESDB_PASSWORD=postgres_shared

      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=10.10.3.143
      - QUEUE_BULL_REDIS_PORT=6379
      #- QUEUE_BULL_REDIS_PASSWORD=n8nredispass

      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_SECURE_COOKIE=false

      - N8N_ENCRYPTION_KEY=3sjURS8OKGvyALqQOUITjxg3IAxpbAdvx3mjTYK8aVI=
      - N8N_ENVIRONMENT=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

    volumes:
      - data:/home/node/.n8n

    networks:
      network_service:
        ipv4_address: 10.10.3.63


  n8n_worker:
    image: n8nio/n8n:2.3.4-amd64
    container_name: n8n_worker
    command: worker
    restart: unless-stopped

    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=10.10.3.153
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres_shared
      - DB_POSTGRESDB_PASSWORD=postgres_shared

      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=10.10.3.143
      - QUEUE_BULL_REDIS_PORT=6379
      #- QUEUE_BULL_REDIS_PASSWORD=n8nredispass

      - N8N_ENCRYPTION_KEY=3sjURS8OKGvyALqQOUITjxg3IAxpbAdvx3mjTYK8aVI=

    networks:
      network_service:
        ipv4_address: 10.10.3.64


volumes:
  data:
    external: false

networks:
  network_service:
    external: true
